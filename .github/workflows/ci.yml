name: VANTA AI CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint-and-build:
    name: Build & Verify (Mock Providers)
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "file:./dev.db"
      AUTH_SECRET: "vanta_ci_test_secret_key_2026"
      NEXTAUTH_SECRET: "vanta_ci_test_secret_key_2026"
      APP_URL: "http://localhost:3000"
      NODE_ENV: "test"
      GEMINI_API_KEY: "mock_gemini_ci_key"
      FAL_KEY: "mock_fal_ci_key"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Build Next.js Application
        run: npm run build
